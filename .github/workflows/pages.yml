name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the web build only
        run: |
          mkdir -p _site
          cp -R index.html og-image.png Build TemplateData .nojekyll _site/
          cat BuildParts/export.data.unityweb.* > _site/Build/export.data.unityweb
          (cd _site && sha256sum --check ../BuildParts/SHA256SUMS)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
