<html lang="en-us">

    <meta property="og:title" content="Slotgun">
    <meta property="og:description" content="Fly a drone down a neon Las Vegas Strip at night, then fight zombies with a slot-machine gun inside the BELLAZZO casino, in an early-2000s console style. Made with Playbot.">
    <meta property="og:url" content="https://realcraig.github.io/lucky-number-strip/">
    <meta property="og:image" content="https://realcraig.github.io/lucky-number-strip/og-image.png?v=2a36272e9ed0">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Slotgun">
    <meta name="twitter:description" content="Fly a drone down a neon Las Vegas Strip at night, then fight zombies with a slot-machine gun inside the BELLAZZO casino, in an early-2000s console style. Made with Playbot.">

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="slotgun-loader">
        <div id="slotgun-backdrop"></div>
        <div id="slotgun-card">
          <img id="slotgun-logo" src="TemplateData/logo.png" alt="Slotgun">
          <div id="slotgun-bar"><div id="slotgun-fill"></div><div id="slotgun-bulbs"></div></div>
          <div id="slotgun-status"><span id="slotgun-line">Shuffling the deck</span><span id="slotgun-percent">0%</span></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-fullscreen-button" title="Fullscreen"></div>
      <div id="unity-build-title"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner for a few seconds, or a permanent error over the canvas if type=='error'.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #c8102e; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #ffd140; color: #120e2a; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/export.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/export.data.unityweb",
        frameworkUrl: buildUrl + "/export.framework.js.unityweb",
        codeUrl: buildUrl + "/export.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Slotgun",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.body.classList.add("mobile");
      }


      // Flavour lines rotate while the casino loads.
      var lines = ["Shuffling the deck", "Polishing the chips", "Waking the dead", "Oiling the reels", "Loading the slotgun", "Bribing the pit boss"];
      var lineIndex = 0;
      var lineTimer = setInterval(function() {
        lineIndex = (lineIndex + 1) % lines.length;
        document.querySelector("#slotgun-line").textContent = lines[lineIndex];
      }, 1400);

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var percent = Math.round(100 * progress);
          document.querySelector("#slotgun-fill").style.width = percent + "%";
          document.querySelector("#slotgun-percent").textContent = percent + "%";
        }).then((unityInstance) => {
          clearInterval(lineTimer);
          var loader = document.querySelector("#slotgun-loader");
          loader.classList.add("done");
          setTimeout(function() { loader.remove(); }, 600);
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          clearInterval(lineTimer);
          unityShowBanner(message, 'error');
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
